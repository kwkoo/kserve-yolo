# Downloaded from https://github.com/kserve/kserve/blob/master/config/runtimes/kserve-torchserve.yaml
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: yolo
spec:
  annotations:
    opendatahub.io/accelerator-name: managed-gpu
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/template-display-name: TorchServe
    openshift.io/display-name: yolo
    serving.kserve.io/enable-prometheus-scraping: "true"
    prometheus.kserve.io/port: "8082"
    prometheus.kserve.io/path: "/metrics"
  supportedModelFormats:
    - name: pytorch
      version: "1"
      autoSelect: true
      priority: 2
  protocolVersions:
    - v1
    - v2
    - grpc-v2
  containers:
    - name: kserve-container
      image: ghcr.io/kwkoo/openshift-torchserve-kfs:0.10.0-gpu
      #image: docker.io/pytorch/torchserve-kfs:0.10.0-gpu
      args:
        - torchserve
        - --start
        - --model-store=/mnt/models/model-store
        - --ts-config=/mnt/models/config/config.properties
      env:
        - name: "TS_SERVICE_ENVELOPE"
          value: "kservev2"
      livenessProbe:
        httpGet:
          path: /v2/models
          port: 8080
        initialDelaySeconds: 600
  tolerations:
    - key: nvidia.com/gpu
      operator: "Exists"
      effect: NoSchedule
